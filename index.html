      return `<g transform="translate(${x} ${y}) scale(${s})">${use('broad-leaf',0,0,.94,-45,colors[0])}${use('broad-leaf',-3,0,1.05,-10,colors[1])}${use('broad-leaf',3,0,.85,32,colors[0])}${use('broad-leaf',4,0,.8,68,colors[2])}${use('sprig',3,0,.63,54,colors[1])}</g>`;
    }
    function canopy(){let leaves='';const places=[[1493,80,1.5,-65],[1454,45,1.3,-98],[1401,42,1.25,-55],[1355,36,1.16,-87],[1302,27,1.1,-63],[1257,18,.97,-90],[1208,14,.94,-60],[1164,6,.78,-92],[1435,120,1.2,-108],[1455,148,1.12,-147],[1476,181,1,-140],[1505,211,1.3,-143],[1399,48,.9,25],[1322,26,.85,28],[1245,13,.78,19]];places.forEach((p,i)=>leaves+=use('oval-leaf',...p,['#315f49','#3b7253','#518263','#2b5c45'][i%4]));return `<path d="M1500-18q-63 51-151 46l-184-16 1-9 181 6q66-3 109-28Z" fill="#526343"/><path d="M1504-10q-20 82-2 170l-20 33q-30-110-12-196Z" fill="#6d7150"/>${leaves}<path d="M1337 1q-4 41 15 62t-1 23q-13-5 1-16" fill="none" stroke="#5e8357" stroke-width="3"/><path d="M1420-11q-9 64-55 66-41 0-51-37" stroke="#618461" fill="none" stroke-width="4"/>`;}
    function voiceWaves(x,y,dir){return `<g class="voice-waves" transform="translate(${x} ${y}) scale(${dir} 1)" aria-hidden="true"><path d="M0 -7q6 7 0 14"/><path d="M8 -13q10 13 0 26"/><path d="M16 -19q14 19 0 38"/></g>`;}
    function ambientBack(){return `<g class="sun-rays" aria-hidden="true"><path d="M905 -10 770 430h80L975 -10Z" fill="#fff8d6" opacity=".55"/><path d="M1040 -10 975 400h55l70-410Z" fill="#fff8d6" opacity=".45"/><path d="M1175 -10 1158 370h44l15-380Z" fill="#fff8d6" opacity=".4"/></g>`;}
    function ambientFront(mode){
      const flies=[[640,250],[760,180],[880,305],[1020,215],[1185,140],[1300,262],[1425,205],[560,335],[965,120],[1385,330]].map(([x,y],i)=>`<circle class="firefly" cx="${x}" cy="${y}" r="${2.4+i%3}" style="animation-duration:${5+i%4}s;animation-delay:-${(i*.7).toFixed(1)}s"/>`).join('');
      const leaves=[[700,-20],[985,-40],[1250,-10],[860,-60],[1405,-30]].map(([x,y],i)=>`<path class="falling-leaf" d="M${x} ${y}q9-9 18 0-9 9-18 0Z" fill="${['#8db36f','#d9a441','#6f9d62'][i%3]}" style="animation-duration:${(9+i*1.7).toFixed(1)}s;animation-delay:-${(i*2.3).toFixed(1)}s"/>`).join('');
      const butterfly=`<g class="butterfly-path"><g transform="translate(820 262)"><path class="wing" d="M0 0q-14-16-20-4-4 10 20 4Z" fill="#e58f3e"/><path class="wing wing-r" d="M0 0q14-16 20-4 4 10-20 4Z" fill="#f0b552"/><ellipse rx="1.6" ry="6" fill="#3d3a2c"/></g></g>`;

    function landscape(mode='hero'){
      const mobile=window.matchMedia('(max-width:650px)').matches;

    function fireworks(host){for(let i=0;i<25;i++){const s=el('i','spark');const angle=i/25*Math.PI*2,d=70+(i%5)*24;s.style.setProperty('--c',['#e1aa3f','#5b9571','#d57b48','#86b4a3'][i%4]);s.style.setProperty('--dx',Math.cos(angle)*d+'px');s.style.setProperty('--dy',Math.sin(angle)*d+'px');s.setAttribute('aria-hidden','true');host.append(s);setTimeout(()=>s.remove(),1100);}}

    function renderChallenge(a){const q=a.pool[a.id],st=a.st;const feedback=st.resolved?(st.correct?`<div class="notice"><span class="goal-icon">${ic('star')}</span><div><b>Betul! Satu bintang untuk kamu.</b><p>${q.nums.map(fmt).join(' + ')} = ${fmt(q.answer)}.</p></div></div>`:`<div class="notice"><span class="cap-icon">${ic('cap')}</span><div><b>Mari lihat bersama. Jawapannya ${fmt(q.answer)}.</b><p>Tambah setiap lajur, termasuk nilai yang dibawa.</p></div></div>${placeBoard(q.nums,3)}<div class="steps-text">${columnSteps(q.nums).map(s=>`<p>${stepText(s)}</p>`).join('')}</div>`):st.attempts?`<div class="notice"><span class="cap-icon">${ic('cap')}</span><div><b>Petunjuk Cikgu Cher</b><p>${q.hint}</p></div></div><div id="retry-board">${placeBoard(q.nums,0)}</div><p class="muted">${a.busy?'Perhatikan langkah dari kanan ke kiri.':'Cuba sekali lagi. Kamu boleh!'}</p>`:'';
      a.host.innerHTML=`<div class="question-inner ${st.correct?'celebrate':''}"><div class="eyebrow">${ic('flag')}Cabaran ${a.id+1} daripada ${a.pool.length}</div>${st.correct?'<svg class="result-kiko" viewBox="0 -12 210 250" aria-hidden="true"><g class="happy"><use href="#kiko-art"/></g></svg>':''}<h2 tabindex="-1">${q.nums.map(fmt).join(' + ')} = ?</h2><p>${st.resolved?'Semak hasil tambah kamu.':'Pilih nombor yang membuka pintu ini.'}</p><div class="choices">${q.choices.map(val=>`<button type="button" data-answer="${val}" class="choice ${st.resolved&&val===q.answer?'correct':''} ${val===st.wrong?'wrong':''}" ${st.resolved||a.busy?'disabled':''}>${fmt(val)}</button>`).join('')}</div><div class="feedback" aria-live="polite">${feedback}${st.resolved?`<button type="button" class="btn btn-green" data-action="continue-question">${a.pool===practiceQuestions&&a.id===4?'Lihat pencapaian':'Teruskan misi'}${ic('arrow')}</button>`:''}</div></div>`;}
    function assessChoice(q,previous,val){if(previous.resolved||!q.choices.includes(val))return previous;const attempts=previous.attempts+1,correct=val===q.answer;return {attempts,correct,wrong:correct?null:val,resolved:correct||attempts>=2};}
    function answerChallenge(val){const a=activeChallenge;if(!a||a.busy||a.st.resolved)return;const q=a.pool[a.id];if(!q.choices.includes(val))return;unlockAudio();Object.assign(a.st,assessChoice(q,a.st,val));a.busy=!a.st.resolved;sfx(a.st.correct?'ding':'buzz');renderChallenge(a);
      if(a.st.correct){fireworks(a.host.querySelector('.question-inner'));a.host.querySelector('[data-action="continue-question"]')?.focus({preventScroll:true});}else if(a.busy){hintTimer=setTimeout(()=>{if(a!==activeChallenge)return;const board=$('#retry-board');if(board)board.innerHTML=placeBoard(q.nums,1);hintTimer=setTimeout(()=>{if(a!==activeChallenge)return;a.busy=false;renderChallenge(a);a.host.querySelector('.choice')?.focus({preventScroll:true});},1250);},1050);}else{a.host.querySelector('[data-action="continue-question"]')?.focus({preventScroll:true});}}
    function quizPage(){
      const url=session.quiz||QUIZIZZ_URL;
      const code=new URL(url).searchParams.get('gc');
      return `<div class="page wrap">${crumb('Misi 3')}<div class="page-heading">${capsLabel('Ekspedisi Hutan Nombor &nbsp; / &nbsp; Misi 03','compass')}<h1>Kuiz Harta Karun</h1><p>Gunakan kuasa nilai tempat kamu dalam cabaran terakhir.</p></div>
        <section class="section-rule" aria-labelledby="quiz-class-title"><h2 id="quiz-class-title">Kuiz Kelas Quizizz</h2><p class="muted">Sertai kuiz guru di Wayground.${code&&/^\d+$/.test(code)?` Kod kelas: <strong>${code}</strong>.`:''} Jika kuiz tidak dipaparkan di bawah, gunakan pautan ini.</p>
        <div class="actions spaced">${resourceLink('quiz-new-tab',url,'Buka kuiz dalam tab baharu','flag')}<button type="button" data-action="practice-start" class="plain-link">Cuba latihan kendiri${ic('arrow')}</button></div></section>
        <div id="quiz-area"><div id="quiz-embed"></div></div><div class="notice spaced">${ic('shield')}<p>Latihan kendiri tidak meminta nama. Skor hanya berada dalam ingatan halaman ini. Kuiz pihak ketiga mengikut tetapan privasi guru.</p></div></div>`;
    }
    function mountQuiz(){const host=$('#quiz-embed'),link=$('#quiz-new-tab');if(!host||!link)return;const frame=document.createElement('iframe');frame.title='Kuiz kelas Quizizz: Misteri Nombor Hilang';frame.className='embed-quiz';frame.referrerPolicy='no-referrer';frame.allow='fullscreen';frame.src=link.href;host.append(frame);}
    function startPractice(){const box=$('#quiz-area');if(!box)return;unlockAudio();practice={index:0,answers:{}};box.className='surface';box.innerHTML='<div class="question-state" id="practice-screen"></div>';practiceStep();}
    function practiceStep(){if(!practice)return;const p=practice;if(p.index>=practiceQuestions.length){const score=Object.values(p.answers).filter(s=>s.correct).length;session.done[2]=true;session.scores[2]=score;activeChallenge=null;$('#quiz-area').innerHTML=`<div class="result">${starRow(earnedStars(score))}<h2>Syabas, penjelajah!</h2><p>Kamu menjawab ${score} daripada 5 soalan dengan betul.</p><p>${score>=4?'Kamu menguasai cabaran tambah ini.':'Cuba ulang Misi 2 untuk mengukuhkan nilai tempat.'}</p><div class="actions"><a href="#utama" class="btn btn-green">Kembali ke peta misi${ic('map')}</a><button data-action="practice-start" class="btn btn-light">${ic('repeat')}Cuba semula</button></div></div>`;sfx('ding');return;}startChallenge($('#practice-screen'),practiceQuestions,p.index,p.answers,()=>{p.index++;practiceStep();});}
  </script>
  <script>
    const segmentNames=['Set Induksi dan Pengenalan','Aktiviti Utama dan Penerokaan','Aplikasi, Pengukuhan dan Penutup'];
    const fieldNames=['Aktiviti','Media','Pentaksiran'];
    function rphPage(){return `<div class="page wrap">${crumb('RPH')}<div class="page-heading">${capsLabel('Ruang guru','book')}<h1>Rancangan Pengajaran Harian</h1><p>Matematik Tahun 3 Bijaksana: tambah dalam lingkungan 10 000.</p></div><div class="fact-list"><span>${ic('people')}30 murid</span><span>${ic('clock')}60 minit</span><span>${ic('compass')}Model ASSURE</span></div>
      <section class="section-rule" aria-labelledby="rph-source-title"><h2 id="rph-source-title">Lampiran RPH</h2>
        <p class="muted" style="overflow-wrap:anywhere">Dokumen asal: <strong>${decodeURIComponent(new URL(RPH_URL).pathname.split('/').pop())}</strong></p>
        <div class="actions spaced">${resourceLink('rph-link',RPH_URL,'Buka lampiran RPH (PDF)','file')}<button type="button" class="plain-link" data-action="copy-rph">Salin alamat PDF</button></div>
        <p class="field-help spaced">Pautan ini merujuk kepada folder Downloads pada komputer guru. Untuk membaca salinan PDF pada peranti lain, pilih fail di bawah.</p>
        <div class="actions no-print"><label class="btn btn-light file-link">${ic('file')}${session.pdf?'Tukar salinan PDF':'Pilih salinan PDF'}<input type="file" id="rph-pdf" accept="application/pdf,.pdf" aria-label="Pilih salinan PDF RPH pada peranti ini"></label>${session.pdf?`<button type="button" class="btn btn-light" data-action="view-pdf">Lihat salinan PDF${ic('book')}</button>`:''}</div>
      </section>
      <section class="section-rule two-col"><div><h2>Objektif pembelajaran</h2><p class="eyebrow" style="margin-bottom:9px">Objektif ABCD</p><blockquote class="objective">Pada akhir pengajaran, murid Tahun 3 Bijaksana dapat menyelesaikan sekurang-kurangnya 4 daripada 5 ayat matematik tambah dua dan tiga nombor dalam lingkungan 10 000 dengan betul menggunakan nilai tempat dan kad nombor.</blockquote></div><div><h2>Profil kelas</h2><div class="persona"><div class="donut" role="img" aria-label="Carta persona: 65 peratus visual-kinestetik, 20 peratus auditori dan lain-lain, 15 peratus memerlukan sokongan"><strong>30<small>murid</small></strong></div><div class="legend"><p><i class="dot" style="background:#448268"></i><span><b>65%</b> visual-kinestetik</span></p><p><i class="dot" style="background:#d6a342"></i><span><b>20%</b> auditori dan lain-lain</span></p><p><i class="dot" style="background:#d77e56"></i><span><b>15%</b> perlu sokongan nilai tempat dan mengumpul semula</span></p></div></div></div></section>
      <section class="section-rule"><h2>Standard kurikulum</h2><ul class="standards"><li><b>SK 2.1</b><span>Tambah dalam lingkungan 10 000.</span></li><li><b>SP 2.1.1</b><span>Menyelesaikan ayat matematik tambah melibatkan dua nombor, hasil tambah dalam lingkungan 10 000.</span></li><li><b>SP 2.1.2</b><span>Menyelesaikan ayat matematik tambah melibatkan tiga nombor, hasil tambah dalam lingkungan 10 000.</span></li></ul></section>
      <section class="section-rule"><div class="section-top"><div>${capsLabel('Garis masa pengajaran','flag')}<h2>Tiga segmen pembelajaran</h2></div></div><p class="note">${session.rph.every(Boolean)?'Ringkasan di bawah disalin oleh guru daripada RPH sebenar untuk sesi ini.':'Rujuk Lampiran RPH di atas untuk menyalin aktiviti, media dan instrumen pentaksiran daripada Tugasan 2.'}</p><div class="timeline">${segmentNames.map((name,i)=>`<details ${i===0?'open':''}><summary><strong>0${i+1}</strong><span>Segmen ${i+1}: ${name}</span></summary><dl class="rph-fields">${fieldNames.map((key,j)=>`<div><dt>${key}</dt><dd data-rph-value="${i}-${j}">Belum dibekalkan daripada RPH asal.</dd></div>`).join('')}</dl><button class="plain-link" data-rph-edit="${i}">${ic('edit')}${session.rph[i]?'Sunting':'Masukkan'} ringkasan segmen</button></details>`).join('')}</div>
      <p class="field-help">Ringkasan dan salinan PDF pilihan hanya digunakan dalam sesi ini. Pautan lampiran asal kekal dalam laman.</p></section>
      <section class="section-rule"><h2>Bahan digital yang menyokong RPH ini</h2><div class="material-links">${missions.map((m,i)=>`<a href="#misi-${i+1}">${ic(['map','play','flag'][i])}Misi ${i+1}: ${m.name}${ic('arrow')}</a>`).join('')}</div></section></div>`;}
    function fillRph(){session.rph.forEach((record,i)=>{if(record)record.forEach((text,j)=>{const dd=$(`[data-rph-value="${i}-${j}"]`);if(dd)dd.textContent=text;});});}
    function showRphAddress(){
      modal('Buka lampiran RPH',`<p>PDF ini berada pada komputer guru, bukan pada pelayan web. Pada komputer tersebut, salin alamat ini dan tampalkan pada bar alamat pelayar.</p>
        <div class="form-grid spaced"><label>Alamat PDF asal<input id="rph-address" readonly spellcheck="false"></label><div class="actions"><button type="button" class="btn btn-green" data-action="copy-rph">Salin alamat PDF</button><button type="button" class="btn btn-light" data-action="choose-rph">Pilih salinan PDF</button></div><p id="rph-copy-status" class="form-status" role="status"></p></div>`);
      $('#rph-address').value=RPH_URL;$('#rph-address').focus();$('#rph-address').select();
    }
    async function copyRphAddress(){
      try{await navigator.clipboard.writeText(RPH_URL);const status=$('#rph-copy-status');if(status)status.textContent='Alamat PDF telah disalin. Tampalkan pada bar alamat pelayar.';else notify('Alamat PDF telah disalin.');}
      catch{if(!$('#rph-address'))showRphAddress();$('#rph-address').focus();$('#rph-address').select();$('#rph-copy-status').textContent='Alamat telah dipilih. Gunakan arahan Salin pada peranti anda.';}
    }
    function editRph(i){if(!Number.isInteger(i)||i<0||i>2)return;modal('Ringkasan RPH sebenar',`<div class="eyebrow">Segmen ${i+1}</div><h3>${segmentNames[i]}</h3><p class="field-help">Salin kandungan daripada Tugasan 2, tanpa maklumat peribadi murid.</p><form id="rph-editor" class="form-grid">${fieldNames.map((name,j)=>`<label>${name}${j===2?' dan instrumen':''}<textarea id="rph-input-${j}" required maxlength="4000" rows="3"></textarea></label>`).join('')}<button class="btn btn-green" type="submit">${ic('check')}Gunakan ringkasan ini</button></form>`);fieldNames.forEach((_,j)=>$('#rph-input-'+j).value=session.rph[i]?.[j]||'');$('#rph-editor').onsubmit=e=>{e.preventDefault();const values=fieldNames.map((_,j)=>$('#rph-input-'+j).value.trim());if(values.some(v=>!v)){notify('Lengkapkan ketiga-tiga bahagian daripada sumber asal.');return;}session.rph[i]=values;closeModal();renderRoute(false);$$('.timeline details')[i].open=true;notify('Ringkasan segmen disimpan dalam sesi ini.');};}
    function attachPdf(input){const f=input.files?.[0];if(!f)return;if(!/\.pdf$/i.test(f.name)||f.size>30*1024*1024){notify('Pilih fail PDF bersaiz tidak melebihi 30 MB.');input.value='';return;}if(session.pdf)URL.revokeObjectURL(session.pdf);session.pdf=URL.createObjectURL(f);renderRoute(false);notify('PDF dilampirkan pada peranti. Salin butiran ke segmen yang berkaitan.');}
    function viewPdf(){if(!session.pdf)return;modal('Dokumen RPH asal','<p class="muted">Dokumen setempat. Tiada fail dihantar ke pelayan.</p><div id="pdf-holder"></div>');const obj=document.createElement('object');obj.type='application/pdf';obj.data=session.pdf;obj.className='pdf-view';obj.setAttribute('aria-label','PDF RPH Tugasan 2');const a=el('a','btn btn-light','Buka PDF pada peranti');a.href=session.pdf;a.target='_blank';a.rel='noopener';obj.append(a);$('#pdf-holder').append(obj);}
    const roles={guru:[['Fasilitator','Tayangkan misi di kelas. Jeda animasi dan ajak kumpulan menerangkan cara mereka menambah.'],['Pemantau','Pantau skor kuiz dan kenal pasti lajur yang masih mengelirukan murid.'],['Pembimbing','Bimbing murid yang memerlukan sokongan dengan kad nombor, rumah nilai tempat dan ulang adegan.']],murid:[['Teroka','Kenali peta dan tonton satu misi pada satu masa.'],['Jawab','Susun digit dan tambah dari kanan ke kiri sebelum memilih jawapan.'],['Bincang','Kongsi langkah dengan rakan kumpulan dan dengar cara mereka berfikir.'],['Refleksi','Terangkan satu perkara yang kamu pelajari. Ulang adegan yang masih sukar.']]};
    function roleContent(role){return `<ul class="role-list">${roles[role].map(r=>`<li><div><b>${r[0]}.</b> ${r[1]}</div></li>`).join('')}</ul>`;}
    function guidePage(){return `<div class="page wrap">${crumb('Panduan')}<div class="page-heading">${capsLabel('Buku panduan penjelajah','map')}<h1>Panduan Guru dan Murid</h1><p>Belajar bersama di kelas, kemudian teroka semula di rumah.</p><div class="actions spaced">${resourceLink('feedback-link',session.form||FORM_URL,'Maklum Balas Google Form','message')}</div></div>
      <section class="section-rule"><div class="mode-label">${ic('compass')}Mod penyampaian blended</div><h2>Satu misi, dua cara belajar</h2><div class="two-col equal"><div><h3>Di kelas, secara segerak</h3><p>Guru menggunakan video dan kuiz bersama murid. Bincangkan setiap cabaran dalam kumpulan dan gunakan kad nombor untuk menunjukkan langkah.</p></div><div><h3>Di rumah, secara tidak segerak</h3><p>Murid mengulang kaji mengikut rentak sendiri. Jeda atau ulang adegan, cuba latihan kendiri dan minta petunjuk Cikgu Cher.</p></div></div></section>
      <section class="section-rule"><h2>Peranan kamu</h2><div class="role-tabs" role="tablist" aria-label="Pilih panduan peranan"><button class="role-tab active" role="tab" id="tab-guru" aria-selected="true" aria-controls="role-content" data-role-tab="guru">${ic('cap')} Untuk guru</button><button class="role-tab" role="tab" id="tab-murid" aria-selected="false" tabindex="-1" aria-controls="role-content" data-role-tab="murid">${ic('compass')} Untuk murid</button></div><div id="role-content" class="readable" role="tabpanel" aria-labelledby="tab-guru">${roleContent('guru')}</div></section>
      <section class="section-rule two-col equal"><div><h2>Kawalan pembelajaran</h2><ul class="role-list"><li><span>Tekan <b>Mulakan Misi</b>, kemudian <b>Tekan untuk bermula</b> untuk mengaktifkan suara.</span></li><li><span>Gunakan butang main, jeda, ulang dan sari kata. Tetapan membolehkan kamu memilih suara serta mengurangkan gerakan.</span></li><li><span>Gunakan <b>Tab</b> untuk bergerak, <b>Enter</b> untuk memilih dan <b>Esc</b> untuk menutup tetingkap.</span></li></ul></div><div><h2>Refleksi penjelajah</h2><p>Rumah manakah yang perlu ditambah dahulu? Apakah yang berlaku apabila jumlah satu lajur mencapai sepuluh?</p><p class="spaced">Ceritakan kepada guru atau gunakan pautan Maklum Balas Google Form di atas untuk berkongsi pengalaman kamu.</p></div></section>
      <details class="settings"><summary>Ruang tetapan guru</summary><div class="settings-body"><p>Urus pautan Quizizz, Google Form dan pilihan AI untuk sesi ini. Tanpa API, Cikgu Cher tetap membantu melalui mod asas.</p><div class="actions spaced"><button class="btn btn-green" data-action="teacher-settings">${ic('settings')}Tetapan sumber</button><button class="btn btn-light" data-action="self-test">${ic('check')}Ujian kendiri</button><a class="plain-link" href="#rph">Lihat RPH${ic('arrow')}</a></div></div></details><p class="note">Tidak perlu mendaftar atau memasukkan nama. Gunakan kuiz tanpa nama dan matikan pengumpulan e-mel dalam borang kelas.</p></div>`;}
    function selectRole(role){if(!roles[role])return;$$('[data-role-tab]').forEach(b=>{const on=b.dataset.roleTab===role;b.classList.toggle('active',on);b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;});$('#role-content').innerHTML=roleContent(role);$('#role-content').setAttribute('aria-labelledby','tab-'+role);}
    function teacherSettings(){
      modal('Tetapan sumber guru',`<p class="field-help">Pautan asal kelas disimpan dalam fail laman dan kekal setiap kali dibuka. Perubahan di sini hanya untuk sesi ini. Kosongkan medan pautan untuk menggunakan semula pautan asal.</p>
        <form id="source-form" class="form-grid" autocomplete="off"><label>Pautan kuiz Quizizz / Wayground<input id="source-quiz" type="url" inputmode="url" aria-describedby="quiz-url-help"></label><p id="quiz-url-help" class="muted">Gunakan pautan HTTPS kuiz atau benaman kelas, bukan pautan penyuntingan.</p><label>Pautan maklum balas Google Form<input id="source-form-url" type="url" inputmode="url"></label>
        <details class="settings" style="margin:0"><summary>Gemini API: pilihan guru</summary><div class="settings-body"><p class="field-help">Mod asas tidak memerlukan kunci. Untuk demonstrasi yang dikendalikan guru, gunakan kunci Gemini yang dihadkan. Hanya kategori topik dihantar, bukan mesej asal murid atau skor.</p><label>Kunci API untuk sesi ini<input type="password" id="source-api" autocomplete="off" spellcheck="false" maxlength="180"></label><p class="field-help">Kunci tidak ditulis ke dalam fail atau storan pelayar. Kos dan syarat penyedia tertakluk pada akaun guru.</p><button class="text-btn" type="button" id="clear-api">Matikan API dan gunakan mod asas</button></div></details>
        <p class="form-status" id="source-status" role="status"></p><button type="submit" class="btn btn-green">${ic('check')}Gunakan tetapan sesi</button></form>`);
      $('#source-quiz').value=session.quiz||QUIZIZZ_URL;$('#source-form-url').value=session.form||FORM_URL;$('#source-api').value=session.apiKey;
      $('#clear-api').onclick=()=>{$('#source-api').value='';session.apiKey='';apiUnavailable=false;$('#chat-mode').textContent='Mod asas';$('#source-status').textContent='API dimatikan. Mod asas sedia digunakan.';};
      $('#source-form').onsubmit=e=>{
        e.preventDefault();const q=$('#source-quiz').value.trim(),f=$('#source-form-url').value.trim();const quiz=safeUrl(q,'quiz'),form=safeUrl(f,'form');
        if(q&&!quiz){$('#source-status').textContent='Gunakan pautan HTTPS daripada Quizizz atau Wayground.';$('#source-quiz').focus();return;}
        if(f&&!form){$('#source-status').textContent='Gunakan pautan HTTPS forms.gle atau docs.google.com.';$('#source-form-url').focus();return;}
        session.quiz=quiz||QUIZIZZ_URL;session.form=form||FORM_URL;session.apiKey=$('#source-api').value.trim();apiUnavailable=false;
        $('#chat-mode').textContent=session.apiKey?'AI sedia':'Mod asas';closeModal();if(route==='panduan'||route==='misi-3')renderRoute(false);notify('Tetapan sumber telah digunakan untuk sesi ini.');
      };
    }
    const credits=[['Watak Dian dan Kiko, grafik dan animasi','Fletcher Valdezron Jalong Sili','Dibina sendiri dengan SVG dan CSS','CC BY-NC 4.0'],['Foto dan potret pencipta','Fletcher Valdezron Jalong Sili','Foto dimuat naik oleh pemilik; potret lalai dibina dengan SVG','Hak milik pencipta; potret lalai CC BY-NC 4.0'],['Fon Baloo 2','Ek Type','Google Fonts','SIL Open Font License 1.1'],['Fon Nunito','Vernon Adams dan penyumbang','Google Fonts','SIL Open Font License 1.1'],['Bunyi kesan','Fletcher Valdezron Jalong Sili','Dijana kod melalui Web Audio API','CC BY-NC 4.0'],['Suara watak','Penyedia suara sistem peranti','Web Speech API','Tertakluk pada lesen peranti'],['Cikgu Cher','Google Gemini API (pilihan); enjin peraturan setempat','Kandungan dijana AI dalam mod API','Tertakluk pada terma perkhidmatan Gemini'],['Kuiz','Quizizz / Wayground','Kuiz kelas yang dipautkan oleh guru','Tertakluk pada lesen pemilik kuiz'],['Kurikulum','Kementerian Pendidikan Malaysia','DSKP KSSR Semakan 2017 Matematik Tahun 3','Hak cipta Kementerian Pendidikan Malaysia']];
    function creatorPortrait(){return `<svg class="creator-portrait-svg" viewBox="0 0 420 525" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Potret digital Fletcher Valdezron Jalong Sili memakai cermin mata, kemeja hitam dan vest kelabu">
      <defs>
        <linearGradient id="cp-wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1e9dc"/><stop offset="1" stop-color="#d9cbb9"/></linearGradient>

      </figure><div class="creator-bio"><div class="eyebrow">Biodata pencipta</div><h2 id="creator-name">Fletcher Valdezron Jalong Sili</h2><div class="bio-meta"><span>Bangsa: <b>Kenyah</b></span><span>Tarikh lahir: <b>23 Ogos 2006</b></span></div><a class="plain-link" href="mailto:g-ipgp24316288@moe-dl.edu.my">g-ipgp24316288@moe-dl.edu.my${ic('external')}</a><p class="bio-text">Lelaki tampan ini merupakan The Best of The Best of The Best di seluruh IPGKTAR. Beliau memiliki frasa yang selalu disebut iaitu "wabba lubba dub dub".</p><p class="field-help">Potret digital dipaparkan secara lalai dan sentiasa kekal dalam laman. Apabila foto asal dipilih, salinan mampat disimpan dalam storan pelayar ini. Butang <b>Jadikan kekal dalam fail</b> memberi kod foto untuk ditampal ke dalam fail laman supaya foto dipaparkan pada semua peranti. Tiada gambar dihantar ke pelayan.</p></div></div></section><section class="section-rule"><h2>Lesen karya</h2><p class="readable">Kerja asli ini dilesenkan di bawah <a class="license-link" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener noreferrer">Creative Commons Attribution-NonCommercial 4.0 (CC BY-NC 4.0)</a>.</p></section><section class="section-rule"><h2>Kredit dan hak cipta</h2><div class="credit-scroll" tabindex="0" role="region" aria-label="Jadual kredit, tatal ke sisi pada telefon"><table class="credits"><thead><tr>${['Bahan','Pencipta/Pemilik','Sumber','Lesen'].map(s=>`<th scope="col">${s}</th>`).join('')}</tr></thead><tbody>${credits.map(r=>`<tr>${r.map(s=>`<td>${s}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section><section class="section-rule"><h2>Etika pembelajaran</h2><div class="notice">${ic('shield')}<p>Laman ini tidak mengumpul data peribadi murid. Kandungan chatbot dijana AI dan hanya untuk bimbingan, bukan pengganti guru.</p></div><p class="muted spaced">Dalam Mod asas, petunjuk Cikgu Cher dijana oleh peraturan setempat tanpa panggilan API.</p></section></div>`;}

  <script>
    const quickPrompts=['Macam mana nak kumpul semula?','Beri saya contoh','Apa itu nilai tempat?','Tolong semak langkah saya'];
    let chatBusy=false,chatLesson=null,apiUnavailable=false;
    function parseAddition(message){const normalized=message.toLowerCase().replace(/(\d)\s+(?=\d{3}\b)/g,'$1').replace(/\btambah\b/g,'+').replace(/sama dengan|ialah/g,'=').replace(/,/g,'');const match=normalized.match(/\b(\d{1,5})\s*\+\s*(\d{1,5})(?:\s*\+\s*(\d{1,5}))?(?:\s*=\s*(\d{1,5}))?\b/);return match?{nums:[Number(match[1]),Number(match[2]),...(match[3]?[Number(match[3])]:[])],claimed:match[4]===undefined?null:Number(match[4])}:null;}
    function offlineReply(message,lesson=null){const t=message.trim().toLowerCase();const reply=(text,topic='local',next=null)=>({text,topic,next});
      if(/@|https?:|\d{6,}|\b(nama (penuh|saya)|alamat (rumah|saya)|sekolah saya|nombor telefon|telefon saya)\b|\b0\d{1,2}[- ]\d{3,4}[- ]?\d{3,4}\b/i.test(t))return reply('Jangan tulis maklumat peribadi, ya. Kita gunakan nombor matematik sahaja. Mahu cuba satu contoh tambah?','privacy');
      if(lesson&&/^\d{1,2}[.!]?$/.test(t)){const st=columnSteps(lesson.nums)[lesson.i],value=parseInt(t,10);if(value!==st.total)return reply(`Cuba kira ${st.parts.join(' tambah ')}${st.before?` dan ${st.before} yang dibawa`:''} sekali lagi. Gunakan jari atau kad nombor untuk membantu.`, 'local',lesson);if(lesson.i===3)return reply('Tepat! Kamu sudah menyemak keempat-empat rumah. Sekarang cuba cara yang sama dalam misi.');const next={nums:lesson.nums,i:lesson.i+1},col=columnSteps(next.nums)[next.i];return reply(`Bagus, tulis ${st.digit} di rumah ${st.label}${st.carry?` dan bawa ${st.carry}`:''}. Seterusnya, di rumah ${col.label}, berapakah ${col.parts.join(' tambah ')}${col.before?` tambah ${col.before} yang dibawa`:''}?`,'local',next);}
      const calc=parseAddition(t);if(calc){if(sum(calc.nums)>10000)return reply('Cikgu Cher membantu tambah dalam lingkungan 10 000 sahaja. Mari cuba 2 100 tambah 1 200 dahulu. Rumah manakah yang kita tambah dahulu?');const canon=a=>[...a].sort((a,b)=>a-b).join('+');const known=[...questions,...practiceQuestions].some(q=>canon(q.nums)===canon(calc.nums));if(known)return reply('Kita cuba contoh serupa dengan nombor berbeza: 1 214 + 2 132. Susun digit mengikut nilai tempat. Di rumah Sa, berapakah 4 tambah 2?','example',{nums:[1214,2132],i:0});
        if(calc.claimed!==null&&calc.nums.every(n=>n<10)){const total=sum(calc.nums);return calc.claimed===total?reply(`Betul, langkah itu tepat. Tulis ${total%10} di rumah Sa${total>=10?` dan bawa ${Math.floor(total/10)} ke rumah Puluh`:''}. Sekarang, digit manakah yang perlu ditambah?`):reply(`Belum tepat, tetapi tidak mengapa. Mulakan dengan ${calc.nums[0]} dan tambah ${calc.nums.slice(1).join(' kemudian ')} menggunakan kad nombor. Cuba kira sekali lagi.`);}
        const digits=calc.nums.map(n=>n%10);return reply(`Selarikan nombor mengikut rumahnya. Mulakan di rumah Sa: ${digits.join(' tambah ')}. Berapakah jumlah dalam lajur itu?`,'local',{nums:calc.nums,i:0});}
      if(/kuiz|quiz|soalan\s*[1-5]|jawapan (akhir|sahaja)/.test(t))return reply('Cikgu beri petunjuk, bukan jawapan akhir. Mari cuba contoh 1 214 + 2 132. Berapakah 4 tambah 2 di rumah Sa?','example',{nums:[1214,2132],i:0});
      if(/kumpul semula|bawa|pindah rumah/.test(t))return reply('Sepuluh sa boleh ditukar menjadi satu puluh. Contohnya, 7 tambah 6 ialah 13. Tulis 3 di rumah Sa dan bawa 1 ke rumah Puluh. Di rumah manakah kamu akan tambah 1 itu?','regroup');
      if(/tiga nombor|3 nombor|tambah tiga/.test(t))return reply('Tambah dua nombor dahulu, kemudian tambah nombor ketiga. Cuba 1 200 + 2 100 + 1 300. Mulakan dengan 1 200 tambah 2 100. Apakah nilai di rumah Ribu bagi hasil pertama?','three');
      if(/nilai tempat|rumah|\bribu\b|\bratus\b|\bpuluh\b|\bsa\b/.test(t))return reply('Nilai tempat ialah rumah bagi setiap digit. Dalam 3 246, 3 di Ribu, 2 di Ratus, 4 di Puluh dan 6 di Sa. Jadi nilai digit 4 ialah 40. Apakah nilai digit 2?','place');
      if(/contoh|latihan/.test(t))return reply('Mari cuba 1 214 + 2 132. Susun Sa dengan Sa dan Puluh dengan Puluh. Di rumah Sa, berapakah 4 tambah 2?','example',{nums:[1214,2132],i:0});
      if(/semak|tolong|langkah|keliru|bantu|susah/.test(t))return reply('Tulis satu langkah kiraan kamu, seperti 7 + 6 = 13. Cikgu akan bantu semak rumah Sa dan nombor yang dibawa. Jika masih keliru, minta guru tunjukkan dengan kad nombor.','check');
      if(/tambah|nombor|matematik/.test(t))return reply('Mulakan dengan menyusun digit mengikut nilai tempat. Tambah dari kanan ke kiri. Mahu cuba contoh atau belajar mengumpul semula?');
      if(/terima kasih|faham|berjaya/.test(t))return reply('Sama-sama, penjelajah! \u{1F33F} Cuba terangkan satu langkah tambah kepada rakan. Tanya guru jika ada bahagian yang masih mengelirukan.');
      return reply('Saya Cikgu Cher, pembantu AI untuk tambah nombor hingga 10 000 sahaja. Mari kembali ke Hutan Nombor. Mahu belajar nilai tempat atau mengumpul semula?');}
    const topicPrompts={regroup:'Bimbing murid memahami mengumpul semula dengan contoh 7 tambah 6. Akhiri dengan satu soalan penuntun.',place:'Terangkan empat nilai tempat menggunakan contoh 3 246. Tanyakan nilai satu digit.',three:'Bimbing kaedah tambah dua nombor dahulu kemudian nombor ketiga, menggunakan contoh 1 200 + 2 100 + 1 300. Jangan beri hasil akhir.'};
    async function requestAI(topic){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),8000);try{
      // Only a fixed learning topic leaves the device, never a child's raw input or score.
      const response=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':session.apiKey},signal:controller.signal,credentials:'omit',referrerPolicy:'no-referrer',body:JSON.stringify({system_instruction:{parts:[{text:SYSTEM_PROMPT}]},contents:[{role:'user',parts:[{text:topicPrompts[topic]}]}],generationConfig:{temperature:.35,maxOutputTokens:220,thinkingConfig:{thinkingBudget:0}}})});if(!response.ok)throw new Error('Respons tidak tersedia');const json=await response.json();const raw=json.candidates?.[0]?.content?.parts?.filter(p=>!p.thought).map(p=>p.text||'').join(' ').trim();if(!raw)throw new Error('Tiada teks');const clean=raw.replace(/[*_`#]/g,'').trim();const compact=clean.replace(/\s/g,'');if([...questions,...practiceQuestions].some(q=>compact.includes(String(q.answer))))throw new Error('Gunakan petunjuk setempat');return (clean.match(/[^.!?]+[.!?]?/g)||[clean]).slice(0,4).join('').trim();
    }finally{clearTimeout(timer);}}
    function setChatBusy(on){chatBusy=on;$('#chat-send').disabled=on;$$('#quick-replies button').forEach(b=>b.disabled=on);$('#chat-form').setAttribute('aria-busy',String(on));}
    async function sendChat(message){const text=String(message).trim().slice(0,300);if(!text||chatBusy)return;const reply=offlineReply(text,chatLesson);chatLesson=reply.next;const log=$('#chat-log');log.append(el('p','bubble student',reply.topic==='privacy'?'Mesej peribadi tidak dipaparkan.':text));$('#chat-input').value='';setChatBusy(true);const typing=el('p','bubble typing','Cikgu Cher sedang menaip...');log.append(typing);log.scrollTop=log.scrollHeight;let result=reply.text;let mode='Mod asas';try{if(session.apiKey&&!apiUnavailable&&navigator.onLine!==false&&topicPrompts[reply.topic]){result=await requestAI(reply.topic);mode='Mod AI';}else{await new Promise(resolve=>setTimeout(resolve,380));}}catch{apiUnavailable=true;result=reply.text;}finally{typing.remove();log.append(el('p','bubble',result||reply.text));while(log.children.length>32)log.firstElementChild.remove();$('#chat-mode').textContent=mode;setChatBusy(false);log.scrollTop=log.scrollHeight;}}

  <script>
    const navItems=[['utama','Utama'],['misi-1','Misi 1'],['misi-2','Misi 2'],['misi-3','Misi 3'],['rph','RPH'],['panduan','Panduan'],['penghargaan','Penghargaan']];

      if(player)syncControls();if(route==='rph')fillRph();if(route==='misi-3')mountQuiz();if(route==='penghargaan')mountCreatorPhoto();

    function continueQuestion(){const a=activeChallenge;if(!a?.st.resolved)return;clearTimeout(hintTimer);activeChallenge=null;a.next();}
    function scrollMap(){const section=$('#peta-misi');if(section){section.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});const first=section.querySelector('a.mission-card');if(first)first.focus({preventScroll:true});}}
    function runSelfTests(){if(route!=='panduan')return;const results=[];const check=(label,fn)=>{try{results.push({label,ok:Boolean(fn())});}catch{results.push({label,ok:false});}};
      check('Sintaks semua skrip setempat',()=>Array.from(document.scripts).filter(s=>!s.src&&(!s.type||s.type==='text/javascript')).every(s=>{new Function(s.textContent);return true;}));
      check('Lima soalan video: nombor, pilihan dan hasil tambah',()=>questions.length===5&&questions.every((q,i)=>q.answer===[3577,5825,7433,6710,7820][i]&&q.answer===sum(q.nums)&&q.choices.length===3&&new Set(q.choices).size===3&&q.choices.includes(q.answer)));
      check('Contoh skrip: 4 355, 3 805 dan 6 600',()=>[0,1,2].every((i)=>sum(storyScenes[i].nombor)===[4355,3805,6600][i]));
      check('Pengumpulan semula, termasuk membawa 2 puluh',()=>columnSteps(questions[2].nums).map(s=>s.total).join(',')==='13,13,14,7'&&columnSteps(questions[4].nums).map(s=>s.total).join(',')==='20,12,18,7');
      check('Dua percubaan, petunjuk dan perlindungan skor berulang',()=>questions.every(q=>{const blank={attempts:0,correct:false,resolved:false,wrong:null},wrong=q.choices.find(n=>n!==q.answer),first=assessChoice(q,blank,wrong),second=assessChoice(q,first,wrong),correct=assessChoice(q,first,q.answer);return !first.resolved&&second.resolved&&!second.correct&&correct.correct&&correct.attempts===2&&assessChoice(q,correct,q.answer)===correct;}));
      check('Cikgu Cher luar talian dan semakan langkah',()=>[...quickPrompts,'tambah tiga nombor','topik lain'].every(m=>offlineReply(m).text.length>20)&&offlineReply('7 + 6 = 13').text.startsWith('Betul')&&offlineReply('7 + 6 = 12').text.startsWith('Belum')&&offlineReply('6',offlineReply('Beri saya contoh').next).next.i===1);
      check('Petunjuk kuiz tidak membocorkan hasil akhir',()=>[...questions,...practiceQuestions].every(q=>{const r=offlineReply(q.nums.map(fmt).join(' + '));return r.topic==='example'&&!r.text.replace(/\s/g,'').includes(String(q.answer));}));
      check('Privasi input dan pengesahan pautan luar',()=>offlineReply('nama saya contoh').topic==='privacy'&&$('#chat-input').maxLength===300&&!safeUrl('javascript:void(0)','quiz')&&!safeUrl('https://example.org','form')&&Boolean(safeUrl('https://forms.gle/test','form')));
      check('Kad FJ mempunyai potret lalai, pemilih foto dan butang simpan kekal',()=>{const template=document.createElement('template');template.innerHTML=creditsPage();const fallback=template.content.querySelector('#creator-photo-fallback svg');const input=template.content.querySelector('#creator-photo-input');return Boolean(fallback)&&fallback.querySelector('defs')!==null&&Boolean(input)&&input.accept.includes('image/jpeg')&&Boolean(template.content.querySelector('[data-action="creator-photo-export"]'))&&Boolean(template.content.querySelector('#creator-photo-status'));});
      check('Keutamaan foto pencipta: kekal dalam fail, storan peranti, kemudian potret lalai',()=>{embeddedCreatorPhoto()===CREATOR_PHOTO_EMBEDDED&&typeof CREATOR_PHOTO_EMBEDDED==='string'&&typeof CREATOR_PHOTO_KEY==='string'&&typeof readCreatorPhoto()==='object'&&typeof exportCreatorPhoto()==='object'&&typeof removeCreatorPhoto()==='object'&&typeof compressCreatorPhoto({type:'image/jpeg',size:1})==='object'&&typeof creatorPhotoDB('read')==='object';});
      check('Tiga pautan asal dipaparkan tanpa tetapan sesi',()=>{
        const saved={quiz:session.quiz,form:session.form};const template=document.createElement('template');
        try{session.quiz='';session.form='';return [[rphPage,'#rph-link',RPH_URL],[quizPage,'#quiz-new-tab',QUIZIZZ_URL],[guidePage,'#feedback-link',FORM_URL]].every(([page,id,url])=>{template.innerHTML=page();const link=template.content.querySelector(id);return link?.getAttribute('href')===url&&link.target==='_blank'&&!link.closest('[hidden],details');});}
        finally{Object.assign(session,saved);}
      });
      const old={muted:session.muted,voice:session.voice,done:[...session.done],scores:[...session.scores]};const fixture=el('div');fixture.hidden=true;fixture.setAttribute('aria-hidden','true');document.body.append(fixture);session.muted=true;session.voice='text';
      // Exercise the actual player and question controls in an invisible, isolated lesson.
      try{for(const m of [1,2])check(`Misi ${m}: semua dialog, jeda soalan dan skrin akhir`,()=>{disposePlayer();fixture.innerHTML=lessonPage(m);const p=player;const seen=[];showItem();let guard=0;while(p.status!=='done'&&guard++<80){if(p.status==='question'){const a=activeChallenge;seen.push(a.id);answerChallenge(a.pool[a.id].answer);continueQuestion();}else if(p.status==='playing'){pausePlayer();if(p.status!=='paused')return false;resumePlayer();advanceLine();}else return false;}return p.status==='done'&&(m===1?seen.length===0:seen.join(',')==='0,1,2,3,4'&&session.scores[1]===5)&&!$('#end-screen').hidden;});
        check('Kuiz kendiri: lima jawapan dan keputusan akhir',()=>{disposePlayer();fixture.innerHTML=quizPage();startPractice();for(let i=0;i<5;i++){if(activeChallenge?.id!==i||sum(practiceQuestions[i].nums)!==practiceQuestions[i].answer)return false;answerChallenge(practiceQuestions[i].answer);continueQuestion();}return session.scores[2]===5&&session.done[2]&&$('#quiz-area').textContent.includes('Syabas');});
      }finally{disposePlayer();fixture.remove();session.muted=old.muted;session.voice=old.voice;session.done=old.done;session.scores=old.scores;}
      check('Tujuh destinasi navigasi dan lima lokasi cabaran',()=>$$('.nav-link').length===7&&sequenceFor(storyScenes).filter(s=>s.type==='question').map(s=>s.q).join(',')==='0,1,2,3,4');
      const passed=results.filter(r=>r.ok).length;modal('Ujian kendiri aplikasi',`<div class="notice">${ic(passed===results.length?'check':'flag')}<div><b>${passed} daripada ${results.length} semakan lulus.</b><p>Ujian dijalankan pada pelayar ini tanpa menggunakan rangkaian. Skor sebenar tidak berubah.</p></div></div><ul class="test-list">${results.map(r=>`<li class="${r.ok?'':'fail'}"><b>${r.ok?'Lulus':'Semak'}:</b> ${r.label}</li>`).join('')}</ul><p class="note">Uji suara pada peranti sebenar. Benaman Quizizz, borang dan API memerlukan pautan atau kunci guru serta sambungan internet.</p>`);}
    const CREATOR_PHOTO_KEY='rimbaIlmuCreatorPhotoV1';
    const CREATOR_PHOTO_DEFAULT='Potret digital pencipta dipaparkan secara lalai dan kekal terpapar. Pilih foto asal untuk menggantikannya pada peranti ini.';
    let creatorPhotoCache='';
    function openCreatorPhotoDB(){
      return new Promise((resolve,reject)=>{
        if(!('indexedDB' in window)){reject(new Error('tiada-indexeddb'));return;}
        const request=indexedDB.open('rimbaIlmuPencipta',1);
        request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains('media'))db.createObjectStore('media');};
        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>reject(request.error);
        request.onblocked=()=>reject(new Error('storan-disekat'));
      });
    }
    function creatorPhotoDB(mode,value){
      return openCreatorPhotoDB().then(db=>new Promise((resolve,reject)=>{
        const tx=db.transaction('media',mode),store=tx.objectStore('media');
        let result=null;
        if(mode==='read'){const req=store.get('portrait');req.onsuccess=()=>{result=req.result||null;};req.onerror=()=>reject(req.error);}
        else if(mode==='write')store.put(value,'portrait');
        else store.delete('portrait');
        tx.oncomplete=()=>{db.close();resolve(result);};
        tx.onerror=()=>{db.close();reject(tx.error);};
        tx.onabort=()=>{db.close();reject(tx.error||new Error('transaksi-dibatalkan'));};
      }));
    }
    function embeddedCreatorPhoto(){return typeof CREATOR_PHOTO_EMBEDDED==='string'&&CREATOR_PHOTO_EMBEDDED.startsWith('data:image/')?CREATOR_PHOTO_EMBEDDED:'';}
    async function readCreatorPhoto(){
      if(creatorPhotoCache)return creatorPhotoCache;
      const embedded=embeddedCreatorPhoto();
      if(embedded){creatorPhotoCache=embedded;return embedded;}
      try{const value=await creatorPhotoDB('read');if(typeof value==='string'&&value.startsWith('data:image/')){creatorPhotoCache=value;return value;}}catch{}
      try{const value=localStorage.getItem(CREATOR_PHOTO_KEY);if(value&&value.startsWith('data:image/')){creatorPhotoCache=value;return value;}}catch{}
      return '';
    }
    async function saveCreatorPhoto(value){
      creatorPhotoCache=value;let saved=false;
      try{await creatorPhotoDB('write',value);saved=true;}catch{}
      try{localStorage.setItem(CREATOR_PHOTO_KEY,value);saved=true;}catch{}
      return saved;
    }
    async function clearCreatorPhoto(){
      creatorPhotoCache='';
      try{await creatorPhotoDB('delete');}catch{}
      try{localStorage.removeItem(CREATOR_PHOTO_KEY);}catch{}
    }
    function setCreatorPhotoStatus(text){const status=$('#creator-photo-status');if(status)status.textContent=text;}
    function applyCreatorPhoto(value){
      const image=$('#creator-photo-img'),fallback=$('#creator-photo-fallback'),reset=$('[data-action="creator-photo-reset"]');
      if(!image)return;
      if(value){image.src=value;image.hidden=false;if(fallback)fallback.hidden=true;if(reset)reset.hidden=false;}
      else{image.removeAttribute('src');image.hidden=true;if(fallback)fallback.hidden=false;if(reset)reset.hidden=true;}
    }
    async function mountCreatorPhoto(){
      const image=$('#creator-photo-img');
      if(!image)return;
      const embedded=embeddedCreatorPhoto();
      if(embedded){creatorPhotoCache=embedded;applyCreatorPhoto(embedded);setCreatorPhotoStatus('Foto pencipta kekal dalam fail laman. Ia dipaparkan pada semua peranti tanpa langkah tambahan.');return;}
      if(creatorPhotoCache){applyCreatorPhoto(creatorPhotoCache);setCreatorPhotoStatus('Foto pencipta dipaparkan daripada storan peranti ini. Gunakan butang jadikan kekal untuk menyimpannya dalam fail laman.');return;}
      setCreatorPhotoStatus('Menyemak foto tersimpan pada peranti...');
      const value=await readCreatorPhoto();
      if(!$('#creator-photo-img'))return;
      applyCreatorPhoto(value);
      setCreatorPhotoStatus(value?'Foto pencipta dipaparkan daripada storan peranti ini.':'Potret digital pencipta dipaparkan secara lalai. Pilih foto asal untuk menggantikannya.');
    }
    async function exportCreatorPhoto(){
      const value=creatorPhotoCache||await readCreatorPhoto();
      if(!value){modal('Foto pencipta kekal dalam fail','<p>Pilih foto asal dahulu menggunakan butang <b>Guna foto asal</b>. Selepas itu, butang ini memberi kod foto yang boleh ditampal ke dalam fail laman.</p>');return;}
      modal('Foto pencipta kekal dalam fail',`<p>Salin kod di bawah, kemudian tampalkan di antara tanda petik pembolehubah <b>CREATOR_PHOTO_EMBEDDED</b> di bahagian atas fail <b>index.html</b>. Simpan fail dan foto akan dipaparkan secara kekal pada semua peranti dan pelayar.</p><div class="form-grid spaced"><label>Kod foto (data URL)<textarea id="creator-photo-code" rows="5" readonly spellcheck="false"></textarea></label><div class="actions"><button type="button" class="btn btn-green" id="copy-photo-code">Salin kod foto</button></div><p class="form-status" id="photo-copy-status" role="status"></p></div>`);
      $('#creator-photo-code').value=value;
      $('#copy-photo-code').onclick=async()=>{try{await navigator.clipboard.writeText(value);$('#photo-copy-status').textContent='Kod foto disalin. Tampalkan ke dalam CREATOR_PHOTO_EMBEDDED, kemudian simpan fail.';}catch{$('#creator-photo-code').focus();$('#creator-photo-code').select();$('#photo-copy-status').textContent='Kod telah dipilih. Gunakan arahan Salin pada peranti.';}};
      $('#creator-photo-code').focus();$('#creator-photo-code').select();
    }
    function compressCreatorPhoto(file){
      return new Promise((resolve,reject)=>{
        if(!file||!file.type.startsWith('image/')){reject(new Error('format'));return;}
        if(file.size>15*1024*1024){reject(new Error('saiz'));return;}
        const objectUrl=URL.createObjectURL(file),image=new Image();
        image.onload=()=>{
          try{
            const scale=Math.min(1,1200/image.naturalWidth,1500/image.naturalHeight);
            const width=Math.max(1,Math.round(image.naturalWidth*scale)),height=Math.max(1,Math.round(image.naturalHeight*scale));
            const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
            const context=canvas.getContext('2d');if(!context)throw new Error('kanvas');
            context.fillStyle='#f4efe4';context.fillRect(0,0,width,height);context.imageSmoothingQuality='high';context.drawImage(image,0,0,width,height);
            let quality=.86,data=canvas.toDataURL('image/jpeg',quality);
            while(data.length>1300000&&quality>.5){quality-=.07;data=canvas.toDataURL('image/jpeg',quality);}
            resolve(data);
          }catch(error){reject(error);}finally{URL.revokeObjectURL(objectUrl);}
        };
        image.onerror=()=>{URL.revokeObjectURL(objectUrl);reject(new Error('imej'));};
        image.src=objectUrl;
      });
    }
    async function handleCreatorPhotoFile(input){
      const file=input.files?.[0];if(!file)return;
      setCreatorPhotoStatus('Menyediakan foto untuk dipaparkan...');
      try{
        const value=await compressCreatorPhoto(file);
        applyCreatorPhoto(value);
        const stored=await saveCreatorPhoto(value);
        setCreatorPhotoStatus(stored?'Foto asal disimpan pada peranti ini. Ia akan muncul semula setiap kali laman ini dibuka dalam pelayar yang sama. Foto tidak dihantar ke pelayan.':'Foto dipaparkan untuk sesi ini, tetapi storan peranti tidak membenarkan ia disimpan. Cuba pelayar yang membenarkan storan setempat.');
        notify(stored?'Foto pencipta disimpan pada peranti ini.':'Foto dipaparkan untuk sesi ini sahaja.');
      }catch(error){
        const text=error.message==='saiz'?'Foto terlalu besar. Pilih foto bersaiz kurang daripada 15 MB.':error.message==='format'?'Pilih fail JPG, PNG atau WebP.':'Foto tidak dapat dibaca. Cuba pilih fail JPG atau PNG yang lain.';
        setCreatorPhotoStatus(text);notify(text);
      }finally{input.value='';}
    }
    async function removeCreatorPhoto(){
      await clearCreatorPhoto();applyCreatorPhoto('');setCreatorPhotoStatus(CREATOR_PHOTO_DEFAULT);notify('Potret digital lalai digunakan semula.');
    }
    const commands={
      'mission-map':scrollMap,'start-player':playPause,'play-pause':playPause,'next-line':advanceLine,'repeat-scene':repeatScene,
      mute:()=>{session.muted=!session.muted;if(!session.muted)unlockAudio();restartLineWithSettings();syncControls();},
      cc:()=>{session.cc=!session.cc;caption();syncControls();},'voice-settings':voiceSettings,transcript,
      'continue-question':continueQuestion,'restart-mission':()=>renderRoute(true),'practice-start':startPractice,
      'teacher-settings':teacherSettings,'view-pdf':viewPdf,'self-test':runSelfTests,
      'copy-rph':copyRphAddress,'choose-rph':()=>{closeModal();$('#rph-pdf')?.click();},'creator-photo-reset':removeCreatorPhoto,'creator-photo-export':exportCreatorPhoto
    };
    $('#main-nav').innerHTML=navItems.map(([id,name],i)=>`${i===4?'<span class="nav-sep" aria-hidden="true"></span>':''}<a class="nav-link" href="#${id}">${i===0?ic('home'):''}${name}</a>`).join('');
    $('#menu-toggle').innerHTML=ic('menu');$('#launch-cap').innerHTML=ic('cap');$('#chat-cap').innerHTML=ic('cap');$('#chat-close').innerHTML=ic('close');$('#dialog-close').innerHTML=ic('close');$('#chat-send').innerHTML=ic('send');$('#footer-brand').innerHTML=ic('compass')+'Rimba Ilmu';
    quickPrompts.forEach(text=>{const b=el('button','',text);b.type='button';b.onclick=()=>sendChat(text);$('#quick-replies').append(b);});
    $('#chat-launch').onclick=()=>toggleChat();$('#chat-close').onclick=()=>toggleChat(false);$('#chat-form').onsubmit=e=>{e.preventDefault();sendChat($('#chat-input').value);};
    $('#dialog-close').onclick=closeModal;$('#app-dialog').addEventListener('close',()=>{if(dialogReturn?.isConnected)dialogReturn.focus({preventScroll:true});dialogReturn=null;$('#dialog-body').replaceChildren();});
    $('#menu-toggle').onclick=()=>{const open=!$('#main-nav').classList.contains('open');$('#main-nav').classList.toggle('open',open);$('#menu-toggle').setAttribute('aria-expanded',String(open));$('#menu-toggle').setAttribute('aria-label',open?'Tutup menu navigasi':'Buka menu navigasi');$('#menu-toggle').innerHTML=ic(open?'close':'menu');};
    $('.skip').onclick=e=>{e.preventDefault();$('#kandungan').focus({preventScroll:true});};
    document.addEventListener('click',e=>{if(e.target instanceof Element&&e.target.closest('#rph-link')&&location.protocol!=='file:'){e.preventDefault();showRphAddress();}});
    document.addEventListener('click',e=>{const target=e.target;if(!(target instanceof Element))return;const b=target.closest('[data-action],[data-answer],[data-role-tab],[data-rph-edit]');if(b&&!b.disabled){if(b.hasAttribute('data-answer'))answerChallenge(Number(b.dataset.answer));else if(b.hasAttribute('data-role-tab'))selectRole(b.dataset.roleTab);else if(b.hasAttribute('data-rph-edit'))editRph(Number(b.dataset.rphEdit));else if(Object.hasOwn(commands,b.dataset.action))commands[b.dataset.action]();}if(!target.closest('.site-header'))closeMenu();const a=target.closest('.nav-link,.brand');if(a&&a.hash==='#'+route){closeMenu();window.scrollTo({top:0,behavior:'instant'});}});
    document.addEventListener('change',e=>{if(e.target.id==='speed'){const n=Number(e.target.value);if([.8,1,1.2].includes(n)){session.speed=n;restartLineWithSettings();}}if(e.target.id==='rph-pdf')attachPdf(e.target);if(e.target.id==='creator-photo-input')handleCreatorPhotoFile(e.target);});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#app-dialog').open)return;if(!$('#chat-panel').hidden)toggleChat(false);else if($('#main-nav').classList.contains('open')){closeMenu();$('#menu-toggle').focus();}}if(e.target.matches('[data-role-tab]')&&['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();const r=e.key==='Home'?'guru':e.key==='End'?'murid':e.target.dataset.roleTab==='guru'?'murid':'guru';selectRole(r);$('#tab-'+r).focus();}});
    window.addEventListener('hashchange',()=>renderRoute(true));document.addEventListener('visibilitychange',()=>{if(document.hidden&&player?.status==='playing')pausePlayer();});
    let artResizeTimer=0,lastArtWidth=window.innerWidth;
    window.addEventListener('resize',()=>{if(window.innerWidth===lastArtWidth)return;lastArtWidth=window.innerWidth;clearTimeout(artResizeTimer);artResizeTimer=setTimeout(()=>{if(route==='utama'&&$('.hero-art'))$('.hero-art').innerHTML=landscape();else if(player&&$('#stage-art')){$('#stage-art').innerHTML=landscape(player.scenes[Math.max(0,player.sceneShown)].latar);if(player.status==='playing')animateActors(player.seq[player.pos].line);}},140);});
    try{if('speechSynthesis' in window){window.speechSynthesis.getVoices();window.speechSynthesis.addEventListener('voiceschanged',()=>{const select=$('#voice-choice');if(!select)return;const selected=select.value;select.replaceChildren(new Option('Automatik: Melayu / Indonesia','auto'));voices().forEach(v=>select.add(new Option(`${v.name} (${v.lang})`,v.voiceURI)));select.add(new Option('Sari kata sahaja','text'));select.value=Array.from(select.options).some(o=>o.value===selected)?selected:'auto';});}}catch{}
    window.addEventListener('pagehide',()=>{if(player?.status==='playing')pausePlayer();if(player)stopSpeech(player);session.apiKey='';apiUnavailable=false;$('#chat-mode').textContent='Mod asas';});
    renderRoute(false);
